[package]
name = "lotmcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Installer and sync core for the Lord of the Mysteries Craft modpack"
license = "MIT"

[[bin]]
name = "lotmcraft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
