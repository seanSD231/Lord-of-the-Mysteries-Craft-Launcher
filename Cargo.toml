[package]
name = "lotmcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Installer and sync core for the Lord of the Mysteries Craft modpack"
license = "MIT"

[[bin]]
name = "lotmcraft"
path = "src/main.rs"

[[bin]]
name = "lotmcraft-gui"
path = "src/gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
flate2 = "1"
tar = "0.4"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", optional = true, features = ["devtools"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
default = []
# Waives the "sign in once first" rule for offline profiles. Off by default, so the
# binaries players receive do not contain the path at all. For dev builds only.
dev-offline = []
# The window. Off by default so `cargo build` stays quick and the CLI has no
# webview dependency; CI builds the GUI binary separately.
gui = ["dep:tauri", "dep:tauri-build"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
