name: Build launcher
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all --verbose
      - name: Test with dev-offline
        run: cargo test --all --features dev-offline --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy with dev-offline
        run: cargo clippy --all-targets --features dev-offline -- -D warnings
      - name: Check the gui builds
        run: cargo clippy --features gui --bin lotmcraft-gui -- -D warnings

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: lotmcraft-windows-x64.exe
            bin: lotmcraft.exe
          # Both mac slices come off this one runner. The Intel image (macos-13) has
          # been retired, so a leg asking for it queues for ever; and only one macOS job
          # runs at a time on this account, so a *second* mac leg is cancelled after it
          # has sat in the queue a quarter of an hour. One job, two targets: the macOS
          # SDK carries both slices, so the cross-compiled x86_64 binary is the same one
          # an Intel host would have produced.
          - os: macos-latest
            target: aarch64-apple-darwin
            name: lotmcraft-macos-arm64
            bin: lotmcraft
            target2: x86_64-apple-darwin
            name2: lotmcraft-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: lotmcraft-linux-x64
            bin: lotmcraft
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Second target
        if: matrix.target2 != ''
        run: rustup target add ${{ matrix.target2 }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build the second slice
        if: matrix.target2 != ''
        run: cargo build --release --target ${{ matrix.target2 }}
      - name: Stage
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.name }}"
          if [ -n "${{ matrix.target2 }}" ]; then
            cp "target/${{ matrix.target2 }}/release/${{ matrix.bin }}" "${{ matrix.name2 }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: matrix.target2 != ''
        with:
          name: ${{ matrix.name2 }}
          path: ${{ matrix.name2 }}

  # A build with offline profiles enabled, for testing before the Microsoft app is
  # approved. Deliberately not attached to any release: it is an Actions artifact that
  # expires, not something a player can stumble into downloading.
  dev:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dev-offline
      - name: Build
        run: cargo build --release --features dev-offline
      - name: Stage
        shell: bash
        run: cp target/release/lotmcraft.exe lotmcraft-dev-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lotmcraft-dev-windows-x64.exe
          path: lotmcraft-dev-windows-x64.exe

  gui:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - name: Build
        run: cargo build --release --features "gui,dev-offline" --bin lotmcraft-gui
      - name: Stage
        shell: bash
        run: cp target/release/lotmcraft-gui.exe lotmcraft-gui-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lotmcraft-gui-windows-x64.exe
          path: lotmcraft-gui-windows-x64.exe
