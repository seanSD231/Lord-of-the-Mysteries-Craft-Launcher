<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lord of the Mysteries Craft</title>
<style>
/* ---------------------------------------------------------------------------
   Built to match LOTM's in-game screens rather than a website:

   - a double frame, accent outside and gold inside, with diamond ornaments at
     every corner and the middle of every edge
   - a diamond lattice over the panel, in the accent at very low alpha
   - buttons with pointed ends, accent fill, lighter top edge
   - headings in the accent with a gold rule and a diamond terminator
   - red for anything that backs out or quits

   The accent is the launcher's own gold-amber rather than a pathway colour,
   since the launcher belongs to no pathway.
--------------------------------------------------------------------------- */
:root {
  --accent:     #c9a227;
  --accent-hi:  #f2d978;
  --accent-dim: #6d5614;
  --gold:       #d9a441;
  --gold-dim:   #8a6a2a;
  --ink:        #0e0d12;
  --panel:      #15141c;
  --panel-2:    #1b1a24;
  --text:       #e8e4dc;
  --text-dim:   #8e8a98;
  --red:        #a8322c;
  --red-hi:     #d7554a;
  --blue:       #4aa3e0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: #07070a;
  color: var(--text);
  /* A real bitmap font is the one asset still missing. Consolas and Lucida
     Console are the closest blocky faces that ship everywhere. */
  font: 13px/1.5 "Consolas", "Lucida Console", "DejaVu Sans Mono", monospace;
  user-select: none; overflow: hidden;
  image-rendering: pixelated;
}

/* ---- the frame ---------------------------------------------------------- */
.frame {
  position: absolute; inset: 10px;
  border: 2px solid var(--accent);
  background: var(--panel);
  display: flex; flex-direction: column;
}
.frame::before {           /* the inner gold rule */
  content: ""; position: absolute; inset: 5px;
  border: 1px solid var(--gold-dim); pointer-events: none;
}
.frame::after {            /* the diamond lattice */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    repeating-linear-gradient(45deg, transparent 0 13px, rgba(201,162,39,.05) 13px 14px),
    repeating-linear-gradient(-45deg, transparent 0 13px, rgba(201,162,39,.05) 13px 14px);
}
/* ornaments: rotated squares pinned to the corners and edge midpoints */
.d {
  position: absolute; width: 9px; height: 9px;
  background: var(--gold); transform: rotate(45deg); z-index: 3;
}
.d.sm { width: 7px; height: 7px; background: var(--accent); }
.d.tl { left: -5px;  top: -5px; }
.d.tr { right: -5px; top: -5px; }
.d.bl { left: -5px;  bottom: -5px; }
.d.br { right: -5px; bottom: -5px; }
.d.tc { left: 50%;   top: -4px;    margin-left: -4px; background: var(--accent-hi); }
.d.bc { left: 50%;   bottom: -4px; margin-left: -4px; background: var(--accent-hi); }
.d.lc { left: -4px;  top: 50%;     margin-top: -4px; }
.d.rc { right: -4px; top: 50%;     margin-top: -4px; }

/* ---- heading ------------------------------------------------------------ */
header { position: relative; padding: 16px 26px 10px; z-index: 2; }
h1 {
  margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
  color: var(--accent-hi);
  text-shadow: 2px 2px 0 #000;
}
h1 .tail { color: var(--gold); }
.subtitle { margin-top: 2px; font-size: 12px; color: var(--text-dim); }
.rule {
  position: relative; height: 1px; background: var(--gold-dim);
  margin: 10px 26px 0;
}
.rule::after {
  content: ""; position: absolute; right: -4px; top: -3px;
  width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg);
}

/* ---- body --------------------------------------------------------------- */
main {
  position: relative; z-index: 2; flex: 1; min-height: 0;
  display: grid; grid-template-columns: 1fr 250px; gap: 18px;
  padding: 14px 26px 10px;
}
.left { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

.box {
  position: relative; border: 1px solid var(--gold-dim);
  background: rgba(0,0,0,.28); padding: 12px 14px;
}
.box .d { width: 6px; height: 6px; background: var(--gold-dim); }

h2 {
  margin: 0 0 8px; font-size: 13px; font-weight: 700;
  color: var(--accent); letter-spacing: .5px;
  display: flex; align-items: center; gap: 8px;
}
h2::after {
  content: ""; flex: 1; height: 1px; background: var(--gold-dim);
}
h2 i {
  width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg);
  display: inline-block; flex: none;
}

.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; font-size: 13px; }
.kv .k { color: var(--text-dim); }
.kv .v { color: var(--text); }
.kv .v.good { color: #6fbf5e; }
.kv .v.warn { color: var(--red-hi); }

/* the sanity-bar look, for progress */
.bar {
  margin-top: 8px; height: 9px; background: #0a0a0e;
  border: 1px solid var(--gold-dim);
}
.bar i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(180deg, #7fc4f0, var(--blue));
  transition: width .18s;
}
.statusline {
  margin-top: 7px; font-size: 12px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.statusline.err { color: var(--red-hi); white-space: normal; }

/* ---- buttons ------------------------------------------------------------ */
.col { display: flex; flex-direction: column; gap: 9px; }
button {
  position: relative; font: inherit; font-weight: 700; letter-spacing: .5px;
  color: var(--text); cursor: pointer;
  padding: 9px 10px;
  background: linear-gradient(180deg, #8d7320 0%, #6b5516 55%, #52410f 100%);
  border: 1px solid var(--accent);
  clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 50%,
                     calc(100% - 13px) 100%, 13px 100%, 0 50%);
  text-shadow: 1px 1px 0 #000;
}
button:hover:not(:disabled) {
  background: linear-gradient(180deg, #b79430 0%, #8c6e1e 55%, #6a5314 100%);
  color: #fff6d8;
}
button:disabled { opacity: .38; cursor: default; }
button.red {
  background: linear-gradient(180deg, #a8322c 0%, #7e2420 55%, #5d1a17 100%);
  border-color: var(--red-hi);
}
button.red:hover:not(:disabled) {
  background: linear-gradient(180deg, #c7433a 0%, #97302a 55%, #71201c 100%);
}
button.play {
  padding: 18px 10px; font-size: 18px; letter-spacing: 3px;
  color: #fff6d8;
}

/* ---- inputs ------------------------------------------------------------- */
label { display: block; font-size: 12px; color: var(--text-dim); margin: 8px 0 4px; }
input[type=text], input[type=number] {
  width: 100%; background: #0a0a0e; border: 1px solid var(--gold-dim);
  color: var(--text); padding: 6px 8px; font: inherit;
}
input:focus { outline: none; border-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); margin-top: 6px; }
.memrow { display: flex; align-items: center; gap: 10px; }
.memrow .val { color: var(--accent-hi); font-weight: 700; min-width: 86px; }
.memrow input[type=number] { width: 92px; }

footer {
  position: relative; z-index: 2;
  padding: 8px 26px 12px; display: flex; justify-content: space-between;
  font-size: 11px; color: #5c5868;
}
.hidden { display: none !important; }
.code { color: var(--accent-hi); letter-spacing: 2px; font-weight: 700; }
</style>
</head>
<body>
<div class="frame">
  <span class="d tl"></span><span class="d tr"></span>
  <span class="d bl"></span><span class="d br"></span>
  <span class="d tc"></span><span class="d bc"></span>
  <span class="d lc"></span><span class="d rc"></span>

  <header>
    <h1 id="packName">Lord of the Mysteries <span class="tail">Craft</span></h1>
    <div class="subtitle" id="packSub">reading the manifest…</div>
  </header>
  <div class="rule"></div>

  <main>
    <div class="left">

      <div class="box">
        <span class="d tl"></span><span class="d br"></span>
        <h2><i></i>PACK</h2>
        <div class="kv">
          <span class="k">Version</span>        <span class="v" id="vPack">—</span>
          <span class="k">Minecraft</span>      <span class="v" id="vMc">—</span>
          <span class="k">NeoForge</span>       <span class="v" id="vNf">—</span>
          <span class="k">Files</span>          <span class="v" id="vFiles">—</span>
          <span class="k">Installed</span>      <span class="v" id="vInstalled">—</span>
        </div>
      </div>

      <div class="box">
        <span class="d tl"></span><span class="d br"></span>
        <h2><i></i>ACCOUNT</h2>
        <div class="kv">
          <span class="k">Signed in as</span>   <span class="v" id="vUser">nobody</span>
          <span class="k">Server</span>         <span class="v" id="vServer">37.114.51.51:25599</span>
        </div>
        <div id="devWrap" class="hidden">
          <label for="devName">offline profile (testing)</label>
          <input type="text" id="devName" value="dev1" spellcheck="false">
        </div>
      </div>

      <div class="box">
        <span class="d tl"></span><span class="d br"></span>
        <h2><i></i>MEMORY</h2>
        <div class="memrow">
          <span class="val"><span id="memVal">6144</span> MB</span>
          <input type="range" id="mem" min="2048" max="65536" step="512" value="6144">
          <input type="number" id="memNum" min="1024" max="131072" step="256" value="6144">
        </div>
        <div class="statusline" style="margin-top:4px">230 mods want 6 GB or more</div>
      </div>

      <div class="box" style="margin-top:auto">
        <span class="d tl"></span><span class="d br"></span>
        <div class="statusline" id="statusLine">checking what is installed…</div>
        <div class="bar"><i id="bar"></i></div>
      </div>

    </div>

    <div class="col">
      <button class="play" id="btnPlay" disabled>PLAY</button>
      <button id="btnLogin">Sign In</button>
      <button id="btnLogout" class="hidden">Sign Out</button>
      <button id="btnVerify">Verify Files</button>
      <button id="btnFolder">Open Folder</button>
      <button class="red" id="btnQuit" style="margin-top:auto">Quit</button>
    </div>
  </main>

  <footer>
    <span id="footLeft">—</span>
    <span id="footRight">v0.1.0</span>
  </footer>
</div>

<script>
const invoke = (c, a) => window.__TAURI__.core.invoke(c, a || {});
const listen = (e, f) => window.__TAURI__.event.listen(e, f);
const $ = id => document.getElementById(id);

function setStatus(t, err) {
  const l = $('statusLine');
  l.textContent = t;
  l.classList.toggle('err', !!err);
}
function setProgress(done, total) {
  $('bar').style.width = (total > 0 ? Math.round(done / total * 100) : 0) + '%';
}
function setBusy(b) {
  for (const id of ['btnPlay','btnLogin','btnVerify','btnLogout'])
    $(id).disabled = b;
}

listen('status',   e => setStatus(e.payload));
listen('progress', e => setProgress(e.payload.done, e.payload.total));
listen('device_code', e => {
  setStatus('open ' + e.payload.url + ' and enter ' + e.payload.code);
});

// the two memory inputs track each other
const clamp = v => Math.max(1024, Math.min(131072, v || 6144));
$('mem').addEventListener('input', e => {
  const v = parseInt(e.target.value, 10);
  $('memVal').textContent = v; $('memNum').value = v;
});
$('memNum').addEventListener('change', e => {
  const v = clamp(parseInt(e.target.value, 10));
  e.target.value = v; $('memVal').textContent = v;
  $('mem').value = Math.min(v, parseInt($('mem').max, 10));
});

async function refresh() {
  try {
    const s = await invoke('status');
    $('packName').innerHTML = s.pack_name.replace(/(\s\S+)$/, ' <span class="tail">$1</span>');
    $('packSub').textContent = 'a modpack for the Lord of the Mysteries server';
    $('vPack').textContent = s.pack_version;
    $('vMc').textContent = s.minecraft;
    $('vNf').textContent = s.neoforge || '—';
    $('vFiles').textContent = s.file_count;
    $('vInstalled').innerHTML = s.installed
      ? '<span class="v good">yes</span>' : '<span class="v warn">not yet</span>';
    $('footLeft').textContent = s.root;

    $('vUser').textContent = s.username || 'nobody';
    $('btnLogin').classList.toggle('hidden', !!s.username);
    $('btnLogout').classList.toggle('hidden', !s.username);
    $('devWrap').classList.toggle('hidden', !s.offline_allowed);

    $('btnPlay').disabled = false;
    setStatus(s.installed ? 'ready' : 'first run — Play installs everything');
  } catch (e) { setStatus(String(e), true); }
}

$('btnLogin').onclick = async () => {
  setBusy(true);
  try { await invoke('login'); await refresh(); }
  catch (e) { setStatus(String(e), true); }
  setBusy(false);
};
$('btnLogout').onclick = async () => { await invoke('logout'); await refresh(); };

$('btnPlay').onclick = async () => {
  setBusy(true); setProgress(0, 1);
  try {
    await invoke('play', {
      memoryMb: clamp(parseInt($('memNum').value, 10)),
      offlineName: $('devWrap').classList.contains('hidden')
        ? null : $('devName').value.trim(),
    });
    setStatus('the game is running');
  } catch (e) { setStatus(String(e), true); }
  setBusy(false);
};

$('btnVerify').onclick = async () => {
  setBusy(true);
  setStatus('hashing every file, this takes a minute');
  try {
    const bad = await invoke('verify_files');
    setStatus(bad.length === 0 ? 'every file matches'
                               : bad.length + ' file(s) differ: ' + bad.slice(0, 3).join(', '));
  } catch (e) { setStatus(String(e), true); }
  setBusy(false);
};

$('btnFolder').onclick = () => invoke('open_folder');
$('btnQuit').onclick = () => window.__TAURI__.core.invoke('quit');

refresh();
</script>
</body>
</html>
