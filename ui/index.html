<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lord of the Mysteries Craft</title>
<style>
/* ---------------------------------------------------------------------------
   Matches LOTM's in-game panels: double frame, diamond ornaments, pointed
   buttons, pathway accent over near-black. Everything accent-coloured reads
   from --accent, so changing pathway recolours the whole window at once.
--------------------------------------------------------------------------- */
:root {
  --accent:    #2fbf4a;
  --accent-hi: #6ef08a;
  --accent-lo: #17331e;
  --gold:      #d9a441;
  --gold-dim:  #7d5f28;
  --panel:     #121119;
  --panel-2:   #0b0a10;
  --text:      #e9e6df;
  --dim:       #857f90;
  --red:       #a8322c;
  --red-hi:    #d7554a;
  --blue:      #4aa3e0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: #06060a;
  color: var(--text);
  font: 12px/1.45 "Consolas", "Lucida Console", "DejaVu Sans Mono", monospace;
  user-select: none; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
/* the window can be any size; the panel does not stretch to fill it */
.frame {
  position: relative;
  width: min(100% - 20px, 960px);
  height: min(100% - 20px, 620px);
  border: 2px solid var(--accent);
  background: var(--panel);
  display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px #000, 0 10px 40px rgba(0,0,0,.6);
}
.frame::before { content: ""; position: absolute; inset: 5px;
  border: 1px solid var(--gold-dim); pointer-events: none; }
.frame::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    repeating-linear-gradient(45deg, transparent 0 13px, rgba(255,255,255,.022) 13px 14px),
    repeating-linear-gradient(-45deg, transparent 0 13px, rgba(255,255,255,.022) 13px 14px); }

.d { position: absolute; width: 9px; height: 9px; background: var(--gold);
     transform: rotate(45deg); z-index: 4; }
.d.tl{left:-5px;top:-5px} .d.tr{right:-5px;top:-5px}
.d.bl{left:-5px;bottom:-5px} .d.br{right:-5px;bottom:-5px}
.d.tc{left:50%;top:-4px;margin-left:-4px;background:var(--accent-hi)}
.d.bc{left:50%;bottom:-4px;margin-left:-4px;background:var(--accent-hi)}
.d.lc{left:-4px;top:50%;margin-top:-4px} .d.rc{right:-4px;top:50%;margin-top:-4px}

/* ---- head --------------------------------------------------------------- */
header { position: relative; z-index: 2; padding: 14px 20px 0;
         display: flex; align-items: center; gap: 14px; }
.sigil {
  width: 46px; height: 46px; flex: none; position: relative;
  border: 2px solid var(--accent); border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, var(--accent-lo), #000 72%);
  display: grid; place-items: center;
}
.sigil::before {
  content: ""; width: 18px; height: 18px; border: 2px solid var(--accent-hi);
  border-radius: 50%;
}
.sigil::after {
  content: ""; position: absolute; width: 2px; height: 32px;
  background: var(--accent-hi);
}
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .5px;
     color: var(--accent-hi); text-shadow: 2px 2px 0 #000; }
h1 em { font-style: normal; color: var(--gold); }
.sub { font-size: 11px; color: var(--dim); margin-top: 1px; }
.rule { position: relative; height: 1px; background: var(--gold-dim); margin: 10px 20px 0; }
.rule::after { content: ""; position: absolute; right: -4px; top: -3px; width: 7px;
  height: 7px; background: var(--gold); transform: rotate(45deg); }

/* ---- body --------------------------------------------------------------- */
main { position: relative; z-index: 2; flex: 1; min-height: 0;
       display: grid; grid-template-columns: 1fr 1fr 186px;
       gap: 14px; padding: 12px 20px 8px; }
.col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

.box { position: relative; border: 1px solid var(--gold-dim);
       background: rgba(0,0,0,.32); padding: 9px 11px; }
h2 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .6px;
     color: var(--accent); display: flex; align-items: center; gap: 7px; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--gold-dim); }
h2 i { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg);
       display: inline-block; flex: none; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12px; }
.kv .k { color: var(--dim); }
.kv .v { color: var(--text); text-align: right; }
.v.good { color: #63c957; } .v.warn { color: var(--red-hi); } .v.acc { color: var(--accent-hi); }

.motd { margin-top: 6px; font-size: 11px; color: var(--dim);
        border-top: 1px dotted #2e2a38; padding-top: 5px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { display: inline-block; width: 7px; height: 7px; transform: rotate(45deg);
       background: #63c957; margin-right: 5px; }
.dot.off { background: var(--red-hi); }

/* ---- pathway picker ----------------------------------------------------- */
.ways { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin-top: 2px; }
.way { height: 16px; border: 1px solid #000; cursor: pointer; position: relative; }
.way:hover { outline: 1px solid var(--text); }
.way.on::after { content: ""; position: absolute; inset: -4px; border: 1px solid var(--gold); }
.wayname { margin-top: 6px; font-size: 11px; color: var(--accent-hi); }

/* ---- memory ------------------------------------------------------------- */
.memrow { display: flex; align-items: center; gap: 8px; }
.memrow .val { color: var(--accent-hi); font-weight: 700; min-width: 74px; font-size: 12px; }
input[type=range] { flex: 1; accent-color: var(--accent); }
input[type=text], input[type=number] {
  background: #08080c; border: 1px solid var(--gold-dim); color: var(--text);
  padding: 4px 6px; font: inherit; width: 100%; }
input[type=number] { width: 72px; }
input:focus { outline: none; border-color: var(--accent); }
label { display: block; font-size: 11px; color: var(--dim); margin: 6px 0 3px; }

/* ---- buttons ------------------------------------------------------------ */
.side { display: flex; flex-direction: column; gap: 12px; }
button {
  font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .4px;
  color: var(--text); cursor: pointer; padding: 6px 8px;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--accent) 62%, #000) 0%,
    color-mix(in srgb, var(--accent) 38%, #000) 55%,
    color-mix(in srgb, var(--accent) 20%, #000) 100%);
  border: 1px solid var(--accent);
  clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 50%,
                     calc(100% - 11px) 100%, 11px 100%, 0 50%);
  text-shadow: 1px 1px 0 #000;
}
button:hover:not(:disabled) { filter: brightness(1.35); }
button:disabled { opacity: .35; cursor: default; }
button.play { padding: 13px 8px; font-size: 15px; letter-spacing: 2.5px;
              color: #fff; }
button.red { background: linear-gradient(180deg,#a8322c 0%,#7e2420 55%,#571915 100%);
             border-color: var(--red-hi); }

/* ---- foot --------------------------------------------------------------- */
.statusline { font-size: 11px; color: var(--dim); white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
.statusline.err { color: var(--red-hi); white-space: normal; }
.bar { margin-top: 5px; height: 8px; background: #07070b; border: 1px solid var(--gold-dim); }
.bar i { display: block; height: 100%; width: 0;
         background: linear-gradient(180deg, #8ed0f5, var(--blue)); transition: width .18s; }
footer { position: relative; z-index: 2; padding: 6px 20px 10px;
         display: flex; justify-content: space-between; font-size: 10px; color: #4f4b5c; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="frame">
  <span class="d tl"></span><span class="d tr"></span><span class="d bl"></span><span class="d br"></span>
  <span class="d tc"></span><span class="d bc"></span><span class="d lc"></span><span class="d rc"></span>

  <header>
    <div class="sigil"></div>
    <div>
      <h1>Lord of the Mysteries <em>Craft</em></h1>
      <div class="sub" id="sub">reading the manifest…</div>
    </div>
  </header>
  <div class="rule"></div>

  <main>
    <!-- left column ----------------------------------------------------- -->
    <div class="col">
      <div class="box">
        <h2><i></i>PACK</h2>
        <div class="kv">
          <span class="k">Version</span>   <span class="v acc" id="vPack">—</span>
          <span class="k">Minecraft</span> <span class="v" id="vMc">—</span>
          <span class="k">NeoForge</span>  <span class="v" id="vNf">—</span>
          <span class="k">Files</span>     <span class="v" id="vFiles">—</span>
          <span class="k">Installed</span> <span class="v" id="vInstalled">—</span>
        </div>
      </div>

      <div class="box">
        <h2><i></i>SERVER</h2>
        <div class="kv">
          <span class="k">Address</span> <span class="v" id="vAddr">—</span>
          <span class="k">Status</span>  <span class="v" id="vUp">checking…</span>
          <span class="k">Players</span> <span class="v" id="vPlayers">—</span>
          <span class="k">Ping</span>    <span class="v" id="vPing">—</span>
        </div>
        <div class="motd" id="vMotd"></div>
      </div>
    </div>

    <!-- middle column --------------------------------------------------- -->
    <div class="col">
      <div class="box">
        <h2><i></i>ACCOUNT</h2>
        <div class="kv">
          <span class="k">Signed in</span> <span class="v" id="vUser">nobody</span>
        </div>
        <div id="devWrap" class="hidden">
          <label for="devName">offline profile (testing)</label>
          <input type="text" id="devName" value="dev1" spellcheck="false">
        </div>
      </div>

      <div class="box">
        <h2><i></i>PATHWAY</h2>
        <div class="ways" id="ways"></div>
        <div class="wayname" id="wayName">The Fool</div>
      </div>

      <div class="box">
        <h2><i></i>MEMORY</h2>
        <div class="memrow">
          <span class="val"><span id="memVal">6144</span> MB</span>
          <input type="range" id="mem" min="2048" max="65536" step="512" value="6144">
          <input type="number" id="memNum" min="1024" max="131072" step="256" value="6144">
        </div>
      </div>

      <div class="box" style="margin-top:auto">
        <div class="statusline" id="statusLine">checking what is installed…</div>
        <div class="bar"><i id="bar"></i></div>
      </div>
    </div>

    <!-- buttons --------------------------------------------------------- -->
    <div class="side">
      <button class="play" id="btnPlay" disabled>PLAY</button>
      <button id="btnLogin">Sign In</button>
      <button id="btnLogout" class="hidden">Sign Out</button>
      <button id="btnVerify">Verify Files</button>
      <button id="btnFolder">Open Folder</button>
      <button class="red" id="btnQuit" style="margin-top:auto">Quit</button>
    </div>
  </main>

  <footer><span id="footLeft">—</span><span>v0.1.0</span></footer>
</div>

<script>
const invoke = (c, a) => window.__TAURI__.core.invoke(c, a || {});
const listen = (e, f) => window.__TAURI__.event.listen(e, f);
const $ = id => document.getElementById(id);

/* The twenty-two pathways, with the colour each one's GUI uses in the mod.
   The launcher has no pathway of its own, so the player picks. */
const PATHWAYS = [
  ["The Fool",            "#a94fd6"], ["The Door",           "#b8862f"],
  ["The Error",           "#4a8fd0"], ["The Visionary",      "#d64fa8"],
  ["The Sun",             "#e2c044"], ["The Tyrant",         "#2f7fd6"],
  ["The Hanged Man",      "#8a6a3f"], ["The Demoness",       "#d6456e"],
  ["The Hermit",          "#c0c6d0"], ["The Moon",           "#7a5bd6"],
  ["The Mother",          "#3fb56a"], ["The Twilight Giant", "#d98a2b"],
  ["The Death",           "#2fbf4a"], ["The Black Emperor",  "#2f49bf"],
  ["The Abyss",           "#7a2fbf"], ["The Paragon",        "#d6b63f"],
  ["The Chained",         "#8f2f2f"], ["The Red Priest",     "#bf2f3a"],
  ["The Darkness",        "#4a4a6a"], ["The Reader",         "#d9d4c6"],
  ["The Justiciar",       "#d9a441"], ["The Wheel of Fortune","#3fb0bf"],
];

let prefs = { pathway: 12, memory: 6144 };

function applyPathway(i) {
  const [name, hex] = PATHWAYS[i];
  const r = document.documentElement.style;
  r.setProperty('--accent', hex);
  r.setProperty('--accent-hi', lighten(hex, 0.45));
  r.setProperty('--accent-lo', darken(hex, 0.72));
  $('wayName').textContent = name;
  [...$('ways').children].forEach((el, n) => el.classList.toggle('on', n === i));
  prefs.pathway = i;
}
function mix(hex, t, toward) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(v => Math.round(v + (toward - v) * t));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
const lighten = (h, t) => mix(h, t, 255);
const darken  = (h, t) => mix(h, t, 0);

PATHWAYS.forEach(([name, hex], i) => {
  const el = document.createElement('div');
  el.className = 'way';
  el.style.background = hex;
  el.title = name;
  el.onclick = () => { applyPathway(i); savePrefs(); };
  $('ways').appendChild(el);
});

async function savePrefs() { try { await invoke('save_prefs', { prefs }); } catch {} }

function setStatus(t, err) {
  const l = $('statusLine'); l.textContent = t; l.classList.toggle('err', !!err);
}
const setProgress = (d, t) => $('bar').style.width = (t > 0 ? Math.round(d / t * 100) : 0) + '%';
function setBusy(b) {
  for (const id of ['btnPlay','btnLogin','btnVerify','btnLogout']) $(id).disabled = b;
}

listen('status',   e => setStatus(e.payload));
listen('progress', e => setProgress(e.payload.done, e.payload.total));
listen('device_code', e => setStatus('open ' + e.payload.url + ' and enter ' + e.payload.code));

const clamp = v => Math.max(1024, Math.min(131072, v || 6144));
$('mem').oninput = e => {
  const v = parseInt(e.target.value, 10);
  $('memVal').textContent = v; $('memNum').value = v; prefs.memory = v; savePrefs();
};
$('memNum').onchange = e => {
  const v = clamp(parseInt(e.target.value, 10));
  e.target.value = v; $('memVal').textContent = v;
  $('mem').value = Math.min(v, +$('mem').max); prefs.memory = v; savePrefs();
};

async function refresh() {
  try {
    const s = await invoke('status');
    $('sub').textContent = 'Minecraft ' + s.minecraft + ' · ' + s.file_count + ' files';
    $('vPack').textContent = s.pack_version;
    $('vMc').textContent = s.minecraft;
    $('vNf').textContent = s.neoforge || '—';
    $('vFiles').textContent = s.file_count;
    const inst = $('vInstalled');
    inst.textContent = s.installed ? 'yes' : 'not yet';
    inst.className = 'v ' + (s.installed ? 'good' : 'warn');
    $('footLeft').textContent = s.root;
    $('vUser').textContent = s.username || 'nobody';
    $('btnLogin').classList.toggle('hidden', !!s.username);
    $('btnLogout').classList.toggle('hidden', !s.username);
    $('devWrap').classList.toggle('hidden', !s.offline_allowed);
    $('btnPlay').disabled = false;
    setStatus(s.installed ? 'ready' : 'first run — Play installs everything');
  } catch (e) { setStatus(String(e), true); }
}

async function pingServer() {
  try {
    const s = await invoke('server_status');
    $('vAddr').textContent = '37.114.51.51:25599';
    const up = $('vUp');
    up.innerHTML = s.online
      ? '<span class="dot"></span>online'
      : '<span class="dot off"></span>offline';
    up.className = 'v ' + (s.online ? 'good' : 'warn');
    $('vPlayers').textContent = s.online ? s.players + ' / ' + s.max_players : '—';
    $('vPing').textContent = s.online ? s.ping_ms + ' ms' : '—';
    $('vMotd').textContent = s.online ? s.motd : s.error;
  } catch (e) { $('vUp').textContent = 'unknown'; }
}

$('btnLogin').onclick = async () => {
  setBusy(true);
  try { await invoke('login'); await refresh(); }
  catch (e) { setStatus(String(e), true); }
  setBusy(false);
};
$('btnLogout').onclick = async () => { await invoke('logout'); await refresh(); };
$('btnPlay').onclick = async () => {
  setBusy(true); setProgress(0, 1);
  try {
    await invoke('play', {
      memoryMb: clamp(parseInt($('memNum').value, 10)),
      offlineName: $('devWrap').classList.contains('hidden') ? null : $('devName').value.trim(),
    });
    setStatus('the game is running');
  } catch (e) { setStatus(String(e), true); }
  setBusy(false);
};
$('btnVerify').onclick = async () => {
  setBusy(true); setStatus('hashing every file, this takes a minute');
  try {
    const bad = await invoke('verify_files');
    setStatus(bad.length === 0 ? 'every file matches' : bad.length + ' file(s) differ');
  } catch (e) { setStatus(String(e), true); }
  setBusy(false);
};
$('btnFolder').onclick = () => invoke('open_folder');
$('btnQuit').onclick = () => invoke('quit');

(async () => {
  try {
    const saved = await invoke('load_prefs');
    if (typeof saved.pathway === 'number') prefs.pathway = saved.pathway;
    if (typeof saved.memory === 'number') prefs.memory = saved.memory;
  } catch {}
  applyPathway(prefs.pathway);
  $('mem').value = Math.min(prefs.memory, 65536);
  $('memNum').value = prefs.memory;
  $('memVal').textContent = prefs.memory;
  refresh();
  pingServer();
  setInterval(pingServer, 30000);
})();
</script>
</body>
</html>
